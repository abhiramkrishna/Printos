<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printos </title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 122.26 150.6'%3E%3Cpath fill='%232D9ED8' d='M122.26,61.13c0,33.76-27.37,61.13-61.13,61.13-7.42,0-14.54-1.32-21.12-3.75v-57.38c0-11.65,9.47-21.13,21.12-21.13s21.13,9.48,21.13,21.13-9.48,21.13-21.13,21.13c-4.53,0-8.73-1.43-12.17-3.88v22.04c3.85,1.2,7.93,1.84,12.17,1.84,22.68,0,41.13-18.45,41.13-41.13s-18.45-41.13-41.13-41.13S20.01,38.45,20.01,61.13v45.23C7.72,95.18,0,79.06,0,61.13,0,27.37,27.37,0,61.13,0s61.13,27.37,61.13,61.13Z'/%3E%3Cpolygon fill='%232D9ED8' points='20.01 106.36 40.01 118.51 40.01 150.6 20.01 150.6 20.01 106.36'/%3E%3C/svg%3E">

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#2D9ED8',
              dark: '#1e7eb0',
              light: '#f0f8fc',
              muted: '#8cbcd6'
            },
            dark: '#0f172a'
          },
          boxShadow: {
            'elegant': '0 20px 40px -15px rgba(0,0,0,0.05)',
            'elegant-hover': '0 30px 60px -15px rgba(45,158,216,0.15)',
            'mega-menu': '0 10px 30px -10px rgba(0,0,0,0.1)',
          }
        }
      }
    }
  </script>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />

  <!-- React, ReactDOM, Babel, Lucide -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <!-- Material Symbols Rounded (Icons) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fafafa;
      color: #0f172a;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Material Symbols defaults */
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      font-size: 24px;
      line-height: 1;
    }

    /* Hide scrollbar for clean look */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #2D9ED8;
    }

    /* Custom 3D Swiper Styles */
    .hero-swiper {
      width: 100%;
      padding-top: 50px;
      padding-bottom: 50px;
      overflow: visible;
    }

    .hero-swiper .swiper-slide {
      background-position: center;
      background-size: cover;
      /* Reduced width/height to fix overlap with text */
      width: 320px;
      height: 460px;
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    /* Apply blur and dim to non-active slides */
    .hero-swiper .swiper-slide:not(.swiper-slide-active) {
      filter: blur(8px) brightness(0.7);
      opacity: 0.85;
    }

    /* Keep active slide sharp and bright */
    .hero-swiper .swiper-slide-active {
      filter: blur(0px) brightness(1);
      opacity: 1;
      box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 768px) {
      .hero-swiper .swiper-slide {
        width: 260px;
        height: 380px;
      }
    }

    .hover-lift {
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .hover-lift:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: 0 30px 60px -15px rgba(45, 158, 216, 0.2);
    }

    .image-parallax-container {
      overflow: hidden;
      position: relative;
    }

    .image-parallax-inner {
      height: 120%;
      width: 100%;
      object-fit: cover;
      will-change: transform;
    }

    .reveal-text {
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
    }

    .reveal-text>* {
      transform: translateY(100%);
      opacity: 0;
      display: inline-block;
      will-change: transform;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(40px);
      will-change: transform, opacity;
    }

    .text-outline {
      color: transparent;
      -webkit-text-stroke: 1px rgba(15, 23, 42, 0.2);
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    gsap.registerPlugin(ScrollTrigger);


    // --- MEGA MENU DATA ---
    const CATEGORY_NAMES = [
      "All Products", "Apparel", "Photo Gifts", "Stationery", "Packaging",
      "Signage", "Corporate Gifts", "Drinkware"
    ];

    const MEGA_MENU_DATA = {
      "Apparel": [
        { title: "T-Shirts", links: ["Short Sleeve", "Long Sleeve", "V-Neck", "Performance"] },
        { title: "Outerwear", links: ["Hoodies", "Jackets", "1/4 Zips", "Sweaters"] },
        { title: "Headwear", links: ["Baseball Caps", "Beanies", "Visors"] },
        { title: "Bags", links: ["Tote Bags", "Backpacks", "Duffels"] }
      ],
      "Photo Gifts": [
        { title: "Wall Art", links: ["Canvas Prints", "Metal Prints", "Acrylic", "Wood Prints"] },
        { title: "Books & Calendars", links: ["Photo Books", "Wall Calendars", "Desk Calendars"] },
        { title: "Home Decor", links: ["Custom Blankets", "Pillows", "Coasters"] }
      ],
      "Stationery": [
        { title: "Business Cards", links: ["Standard", "Premium", "Square", "Foil Accent"] },
        { title: "Marketing", links: ["Flyers", "Postcards", "Brochures", "Rack Cards"] },
        { title: "Office", links: ["Letterheads", "Envelopes", "Notepads", "Sticky Notes"] }
      ],
      "Packaging": [
        { title: "Boxes", links: ["Mailer Boxes", "Product Boxes", "Shipping Boxes"] },
        { title: "Labels & Stickers", links: ["Roll Labels", "Sheet Stickers", "Die-Cut Stickers"] },
        { title: "Supplies", links: ["Custom Tape", "Tissue Paper", "Poly Mailers"] }
      ],
      "Signage": [
        { title: "Banners", links: ["Vinyl Banners", "Retractable Banners", "Mesh Banners"] },
        { title: "Signs", links: ["Yard Signs", "Aluminum Signs", "A-Frame Signs"] },
        { title: "Decals", links: ["Window Decals", "Wall Decals", "Car Decals"] }
      ],
      "Corporate Gifts": [
        { title: "Tech", links: ["Power Banks", "USB Drives", "Speakers", "Earbuds"] },
        { title: "Office Accessories", links: ["Pens", "Notebooks", "Padfolios", "Mouse Pads"] },
        { title: "Awards", links: ["Glass Awards", "Acrylic Awards", "Plaques"] }
      ],
      "Drinkware": [
        { title: "Mugs", links: ["Ceramic Mugs", "Travel Mugs", "Campfire Mugs"] },
        { title: "Bottles", links: ["Water Bottles", "Insulated Bottles", "Aluminium"] },
        { title: "Tumblers", links: ["Stainless Steel", "Wine Tumblers", "Plastic Tumblers"] }
      ]
    };

    // Dynamically build "All Products" by combining all the other categories
    MEGA_MENU_DATA["All Products"] = Object.keys(MEGA_MENU_DATA).map(key => ({
      title: key,
      links: MEGA_MENU_DATA[key].map(section => section.title)
    }));

    const LOGO = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.26 150.6" className="w-9 h-9">
        <path fill="#2D9ED8" d="M122.26,61.13c0,33.76-27.37,61.13-61.13,61.13-7.42,0-14.54-1.32-21.12-3.75v-57.38c0-11.65,9.47-21.13,21.12-21.13s21.13,9.48,21.13,21.13-9.48,21.13-21.13,21.13c-4.53,0-8.73-1.43-12.17-3.88v22.04c3.85,1.2,7.93,1.84,12.17,1.84,22.68,0,41.13-18.45,41.13-41.13s-18.45-41.13-41.13-41.13S20.01,38.45,20.01,61.13v45.23C7.72,95.18,0,79.06,0,61.13,0,27.37,27.37,0,61.13,0s61.13,27.37,61.13,61.13Z" />
        <polygon fill="#2D9ED8" points="20.01 106.36 40.01 118.51 40.01 150.6 20.01 150.6 20.01 106.36" />
      </svg>
    );

    // --- REUSABLE HOOKS ---
    function useGSAPAnimations() {
      useLayoutEffect(() => {
        let ctx = gsap.context(() => {
          gsap.utils.toArray('.fade-up').forEach(elem => {
            ScrollTrigger.create({ trigger: elem, start: "top 85%", onEnter: () => gsap.to(elem, { y: 0, opacity: 1, duration: 1, ease: "power4.out" }) });
          });
          gsap.utils.toArray('.reveal-text').forEach(elem => {
            ScrollTrigger.create({ trigger: elem, start: "top 85%", onEnter: () => { gsap.to(elem.children, { y: 0, opacity: 1, duration: 1.2, stagger: 0.1, ease: "power4.out" }); } });
          });
          gsap.utils.toArray('.image-parallax-container').forEach(container => {
            const img = container.querySelector('.image-parallax-inner');
            gsap.to(img, { yPercent: -20, ease: "none", scrollTrigger: { trigger: container, start: "top bottom", end: "bottom top", scrub: true } });
          });
          const marquee = document.querySelector('.scroll-marquee');
          if (marquee) {
            gsap.to(marquee, { xPercent: -50, ease: "none", scrollTrigger: { trigger: document.body, start: "top top", end: "bottom bottom", scrub: 1 } });
          }
        });
        return () => ctx.revert();
      }, []);
    }

    // --- HEADER WITH MEGA MENU ---
    function Header() {
      const [activeMenu, setActiveMenu] = useState(null);
      let timeoutId = useRef(null);

      const handleMouseEnter = (menuName) => {
        clearTimeout(timeoutId.current);
        setActiveMenu(menuName);
      };

      const handleMouseLeave = () => {
        timeoutId.current = setTimeout(() => {
          setActiveMenu(null);
        }, 150);
      };

      return (
        <header className="sticky top-0 w-full z-50 bg-white shadow-sm flex flex-col" onMouseLeave={handleMouseLeave}>
          {/* Top Bar (Logo, Search, Icons) */}
          <div className="border-b border-gray-100 relative z-20 bg-white">
            <div className="max-w-[1600px] mx-auto px-6 tracking-tight lg:px-12 flex justify-between items-center py-4">

              <div className="flex items-center gap-2 cursor-pointer z-20">
                <LOGO />
                <span className="text-2xl font-black tracking-normal">Printos</span>
              </div>

              <div className="hidden lg:flex flex-1 max-w-xl mx-8 relative z-20">
                <input
                  type="text"
                  placeholder="Search products, materials, and more..."
                  className="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm font-medium px-5 py-2.5 rounded-full outline-none focus:border-brand transition-colors"
                />
                <button className="absolute right-3 top-1/2 -translate-y-1/2 text-brand">
                  <span className="material-symbols-rounded" style={{ fontSize: '20px' }}>search</span>
                </button>
              </div>

              <div className="flex items-center gap-6 z-20">
                <button className="flex flex-col items-center justify-center text-gray-700 hover:text-brand transition-colors">
                  <span className="material-symbols-rounded">help</span>
                  <span className="text-[10px] font-semibold mt-1">Help</span>
                </button>
                <button className="flex flex-col items-center justify-center text-gray-700 hover:text-brand transition-colors">
                  <span className="material-symbols-rounded">person</span>
                  <span className="text-[10px] font-semibold mt-1">Sign In</span>
                </button>
                <button className="flex flex-col items-center justify-center text-gray-700 hover:text-brand transition-colors relative">
                  <span className="material-symbols-rounded">shopping_cart_checkout</span>
                  <span className="text-[10px] font-semibold mt-1">Cart</span>
                  <span className="absolute -top-1 -right-1 w-4 h-4 bg-brand text-white text-[9px] font-bold rounded-full flex items-center justify-center">0</span>
                </button>
              </div>
            </div>
          </div>

          {/* Bottom Bar (Categories Horizonatal Navigation) */}
          <div className="bg-white relative z-20 hidden lg:block border-b border-gray-100">
            <div className="max-w-[1600px] mx-auto px-6 lg:px-12">
              <nav className="flex space-x-8">
                {CATEGORY_NAMES.map(cat => (
                  <button
                    key={cat}
                    onMouseEnter={() => handleMouseEnter(cat)}
                    className={`py-3 text-[13px] font-semibold tracking-wide border-b-2 transition-all ${activeMenu === cat ? 'border-brand text-brand' : 'border-transparent text-gray-700 hover:text-brand'}`}
                  >
                    {cat}
                  </button>
                ))}
              </nav>
            </div>
          </div>

          {/* Mega Menu Dropdown Pane */}
          {activeMenu && MEGA_MENU_DATA[activeMenu] && (
            <div
              className="absolute left-0 right-0 w-full bg-white shadow-mega-menu border-b border-gray-200 z-10 animate-[slideDown_0.2s_ease-out]"
              style={{ top: '100%' }}
              onMouseEnter={() => handleMouseEnter(activeMenu)}
            >
              <div className="max-w-[1600px] mx-auto px-6 lg:px-12 py-10">
                <div className={`grid gap-8 ${activeMenu === "All Products" ? 'grid-cols-4 lg:grid-cols-7' : 'grid-cols-2 lg:grid-cols-4'}`}>
                  {MEGA_MENU_DATA[activeMenu].map((col, idx) => (
                    <div key={idx} className="flex flex-col space-y-4">
                      <h4 className="font-bold text-gray-900 border-b border-gray-100 pb-2 text-sm">{col.title}</h4>
                      <ul className="space-y-3">
                        {col.links.map((link, j) => (
                          <li key={j}>
                            <a href="#" className="text-gray-600 hover:text-brand text-sm transition-colors block">
                              {link}
                            </a>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                  {/* Promo Graphic for Sub-menus (exclude on "All Products" for space) */}
                  {activeMenu !== "All Products" && (
                    <div className="col-span-1 lg:col-span-1 lg:col-start-4 hidden lg:block bg-brand-light rounded-xl overflow-hidden relative">
                      <img
                        src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&w=400&q=80"
                        alt="Promo"
                        className="absolute inset-0 w-full h-full object-cover mix-blend-multiply opacity-50"
                      />
                      <div className="relative z-10 p-6 flex flex-col justify-end h-full">
                        <span className="bg-brand text-white text-[10px] uppercase font-bold tracking-widest px-2 py-1 rounded w-fit mb-2">Offer</span>
                        <h5 className="font-bold text-dark text-lg mb-2">20% Off {activeMenu}</h5>
                        <a href="#" className="text-brand font-semibold text-sm hover:underline flex items-center">
                          Shop Sale <span className="material-symbols-rounded ml-1" style={{ fontSize: '16px' }}>arrow_right_alt</span>
                        </a>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          <style dangerouslySetInnerHTML={{
            __html: `
            @keyframes slideDown {
              from { opacity: 0; transform: translateY(-10px); }
              to { opacity: 1; transform: translateY(0); }
            }
          `}} />
        </header>
      );
    }

    function HeroMasonry() {
      useGSAPAnimations();

      return (
        <section className="relative pt-16 lg:pt-24 pb-20 bg-white overflow-hidden z-0">
          <div className="max-w-[1600px] mx-auto px-6 lg:px-12">

            {/* --- TOP HEADER ROW --- */}
            <div className="flex flex-col md:flex-row justify-between items-center mb-12 md:mb-20 relative">


              {/* Center: Main Title */}
              <div className="text-center max-w-4xl mx-auto z-10 fade-up px-4 md:px-0 mb-8 md:mb-0">
                <h1 className="text-5xl md:text-6xl lg:text-[76px] font-black text-dark leading-[1.05] tracking-tight">
                  Elevate Yourself With <br className="hidden lg:block" />
                  <span className="inline-flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.26 150.6" className="inline-block h-[0.85em] w-auto" style={{ verticalAlign: 'middle' }}>
                      <path fill="#2D9ED8" d="M122.26,61.13c0,33.76-27.37,61.13-61.13,61.13-7.42,0-14.54-1.32-21.12-3.75v-57.38c0-11.65,9.47-21.13,21.12-21.13s21.13,9.48,21.13,21.13-9.48,21.13-21.13,21.13c-4.53,0-8.73-1.43-12.17-3.88v22.04c3.85,1.2,7.93,1.84,12.17,1.84,22.68,0,41.13-18.45,41.13-41.13s-18.45-41.13-41.13-41.13S20.01,38.45,20.01,61.13v45.23C7.72,95.18,0,79.06,0,61.13,0,27.37,27.37,0,61.13,0s61.13,27.37,61.13,61.13Z" />
                      <polygon fill="#2D9ED8" points="20.01 106.36 40.01 118.51 40.01 150.6 20.01 150.6 20.01 106.36" />
                    </svg>
                    Printos
                  </span>
                </h1>
              </div>
            </div>

            {/* --- MASONRY IMAGE GRID --- */}
            <div className="flex flex-col md:flex-row gap-4 lg:gap-6 justify-center items-center md:items-stretch h-auto md:h-[500px] lg:h-[600px] fade-up">

              {/* Column 1 */}
              <div className="flex flex-col gap-4 lg:gap-6 w-full md:w-1/5 h-[500px] md:h-full">
                <div className="h-[65%] w-full rounded-[24px] rounded-tr-[48px] overflow-hidden group">
                  <img src="https://i.ibb.co/KcySGy62/Corporate-Gifts.png" alt="Corporate Gifts" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                </div>
                <div className="h-[35%] w-full rounded-[24px] rounded-bl-[48px] overflow-hidden group bg-yellow-400">
                  <img src="ttps://i.ibb.co/4RcB6vPW/Package.png" alt="Signage" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                </div>
              </div>

              {/* Column 2 */}
              <div className="flex flex-col w-full md:w-1/5 h-[400px] md:h-[85%] self-end">
                <div className="h-full w-full rounded-[24px] rounded-tl-[48px] overflow-hidden group">
                  <img src="https://i.ibb.co/ksVnD88m/Signage.png" alt="Package" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                </div>
              </div>

              {/* Column 3 (Center) */}
              <div className="flex flex-col gap-6 w-full md:w-1/5 h-[400px] md:h-full justify-center items-center self-center">
                <div className="w-full aspect-square rounded-[32px] overflow-hidden group bg-yellow-100">
                  <img src="https://i.ibb.co/v6sTtMtF/All-Incorporated-Together.png" alt="All Incorporated Together" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                </div>
                <button className="bg-dark hover:bg-brand text-white font-bold py-3 px-5 rounded-full flex items-center justify-center gap-2 transition-all w-full shadow-elegant text-sm">
                  Explore Collections <span className="material-symbols-rounded" style={{ fontSize: '16px' }}>north_east</span>
                </button>
              </div>

              {/* Column 4 */}
              <div className="flex flex-col w-full md:w-1/5 h-[400px] md:h-[85%] self-start">
                <div className="h-full w-full rounded-[24px] rounded-tl-[48px] rounded-br-[48px] overflow-hidden group">
                  <img src="https://i.ibb.co/4w5FVH3c/Gemini-Generated-Image-w1ypnsw1ypnsw1yp.png" alt="Custom Print" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                </div>
              </div>

              {/* Column 5 */}
              <div className="flex flex-col gap-4 lg:gap-6 w-full md:w-1/5 h-[500px] md:h-full">
                <div className="h-[55%] w-full rounded-[24px] rounded-tr-[48px] overflow-hidden group">
                  <img src="https://i.ibb.co/KcySGy62/Apparel.png" alt="Apparel" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                </div>
                <div className="h-[45%] w-full rounded-[24px] rounded-br-[48px] overflow-hidden group">
                  <img src="https://i.ibb.co/fdNDt2cw/Gifts.png" alt="Gifts" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                </div>
              </div>

            </div>

          </div>
        </section>
      );
    }

    const BUSINESS_NEEDS = [
